spring.application.name=leave-management

# Optional local overrides (copy .env.example to .env at the repo root or in backend/).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Database connection. Values are supplied by the environment (see README > DB setup).
# createDatabaseIfNotExist=true lets a fresh MySQL instance create the schema on first run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leave_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# schema.sql is the source of truth; Hibernate only verifies that the entities match it.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

# Authentication. Tokens are issued by POST /api/auth/login and sent as
# "Authorization: Bearer <token>". Set AUTH_ENABLED=false only for local debugging.
app.auth.enabled=${AUTH_ENABLED:true}

# Default administrator seeded on first start (see DataInitializer).
app.admin.name=${ADMIN_NAME:Omibits Admin}
app.admin.email=${ADMIN_EMAIL:admin@omibits.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

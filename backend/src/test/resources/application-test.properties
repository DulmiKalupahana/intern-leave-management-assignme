spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Hibernate creates the H2 schema from the entities; schema.sql is MySQL-specific.
spring.sql.init.mode=never
# Controller tests focus on validation/response shapes; the auth flow has its own
# tests in AuthFlowTest, which turn enforcement back on.
app.auth.enabled=false
